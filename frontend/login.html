<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeHer - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .logo { font-size: 48px; margin-bottom: 10px; }
    .title { font-size: 32px; font-weight: 700; color: #9b59b6; margin-bottom: 5px; }
    .subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 40px; text-align: center; }

    .login-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: none;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Poppins', sans-serif;
    }
    .tab.active {
      background: #9b59b6;
      color: white;
    }

    .step { display: none; }
    .step.active { display: block; }

    .input-group { margin-bottom: 18px; }
    .input-group label {
      display: block;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 13px 15px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: border 0.3s;
      font-family: 'Poppins', sans-serif;
    }
    .input-group input:focus { border-color: #9b59b6; }
    .input-group input::placeholder { color: rgba(255,255,255,0.25); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Poppins', sans-serif;
    }
    .btn-primary {
      background: linear-gradient(135deg, #9b59b6, #e91e8c);
      color: white;
      margin-top: 6px;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      margin-top: 10px;
    }

    .error { color: #e74c3c; font-size: 13px; margin-top: 12px; text-align: center; }
    .success { color: #2ecc71; font-size: 13px; margin-top: 12px; text-align: center; }

    .divider {
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
      margin: 18px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .loading {
      text-align: center;
      padding: 30px 20px;
      color: rgba(255,255,255,0.6);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(155,89,182,0.3);
      border-top-color: #9b59b6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .password-wrapper { position: relative; }
    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="logo">🛡️</div>
  <div class="title">SafeHer</div>
  <div class="subtitle">Your AI-powered safety companion</div>

  <div class="login-card">

    <!-- ===== STEP 1: Login / Register ===== -->
    <div class="step active" id="stepAuth">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@email.com"/>
        </div>
        <div class="input-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter') doLogin()"/>
            <button class="toggle-pass" onclick="togglePassword('loginPassword')">👁</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="doLogin()">Login →</button>
        <div style="text-align:center;margin-top:14px;">
          <span style="font-size:12px;color:rgba(255,255,255,0.4);cursor:pointer;" onclick="forgotPassword()">
            Forgot password?
          </span>
        </div>
        <div id="loginError" class="error"></div>
        <div id="loginSuccess" class="success"></div>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display:none;">
        <div class="input-group">
          <label>Your Name</label>
          <input type="text" id="regName" placeholder="Priya Sharma"/>
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@email.com"/>
        </div>
        <div class="input-group">
          <label>Password (min 6 characters)</label>
          <div class="password-wrapper">
            <input type="password" id="regPassword" placeholder="Create password"/>
            <button class="toggle-pass" onclick="togglePassword('regPassword')">👁</button>
          </div>
        </div>
        <div class="input-group">
          <label>Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="regConfirm" placeholder="Repeat password" onkeypress="if(event.key==='Enter') doRegister()"/>
            <button class="toggle-pass" onclick="togglePassword('regConfirm')">👁</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="doRegister()">Create Account 🛡️</button>
        <div id="registerError" class="error"></div>
        <div id="registerSuccess" class="success"></div>
      </div>

    </div>

    <!-- ===== STEP 2: Profile Setup (new users) ===== -->
    <div class="step" id="stepProfile">
      <h3 style="margin-bottom:6px;font-size:20px;">Setup Your Profile</h3>
      <p style="color:rgba(255,255,255,0.4);font-size:12px;margin-bottom:22px;">Add emergency contacts to activate SOS</p>

      <div class="input-group">
        <label>Emergency Contact 1 Name</label>
        <input type="text" id="contact1Name" placeholder="Mom / Dad / Friend"/>
      </div>
      <div class="input-group">
        <label>Emergency Contact 1 Phone</label>
        <input type="tel" id="contact1Phone" placeholder="+919876543210"/>
      </div>
      <div class="input-group">
        <label>Emergency Contact 2 Name (Optional)</label>
        <input type="text" id="contact2Name" placeholder="Sister / Friend"/>
      </div>
      <div class="input-group">
        <label>Emergency Contact 2 Phone (Optional)</label>
        <input type="tel" id="contact2Phone" placeholder="+919876543210"/>
      </div>
      <button class="btn btn-primary" onclick="saveProfile()">Save & Start SafeHer 🛡️</button>
      <button class="btn btn-secondary" onclick="skipProfile()">Skip for now →</button>
      <div id="profileError" class="error"></div>
    </div>

    <!-- ===== STEP 3: Loading ===== -->
    <div class="step" id="stepLoading">
      <div class="loading">
        <div class="spinner"></div>
        <div style="font-size:16px;margin-bottom:8px;">Setting up SafeHer...</div>
        <div style="font-size:13px;">Please wait 💜</div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC_cFOpL7irYXrK27ImvlV2YTNQDifPYqM",
      authDomain: "safeher-28bb2.firebaseapp.com",
      databaseURL: "https://safeher-28bb2-default-rtdb.firebaseio.com",
      projectId: "safeher-28bb2",
      storageBucket: "safeher-28bb2.firebasestorage.app",
      messagingSenderId: "1093714755282",
      appId: "1:1093714755282:web:2095969d84ec69d088770b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // If already logged in → go to app
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const snap = await db.ref(`users/${user.uid}`).once('value');
        if (snap.exists()) {
          const profile = snap.val();
          localStorage.setItem('safeher_user_id', user.uid);
          localStorage.setItem('safeher_user_name', profile.name || user.email.split('@')[0]);
          if (profile.contacts) {
            localStorage.setItem('safeher_contacts', JSON.stringify(profile.contacts));
          }
          window.location.href = 'index.html';
        }
      }
    });

    // ===== TAB SWITCH =====
    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      clearErrors();
    }

    function clearErrors() {
      ['loginError','loginSuccess','registerError','registerSuccess'].forEach(id => {
        document.getElementById(id).textContent = '';
      });
    }

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // ===== LOGIN =====
    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      const successEl = document.getElementById('loginSuccess');

      if (!email || !password) {
        errorEl.textContent = '⚠️ Email aur password dono bharein!';
        return;
      }

      errorEl.textContent = '';
      successEl.textContent = 'Logging in...';

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;
        const snap = await db.ref(`users/${user.uid}`).once('value');

        localStorage.setItem('safeher_user_id', user.uid);

        if (snap.exists()) {
          const profile = snap.val();
          localStorage.setItem('safeher_user_name', profile.name || email.split('@')[0]);
          if (profile.contacts) {
            localStorage.setItem('safeher_contacts', JSON.stringify(profile.contacts));
          }
          showLoading();
          setTimeout(() => window.location.href = 'index.html', 1200);
        } else {
          // New user via login — show profile setup
          localStorage.setItem('safeher_user_name', email.split('@')[0]);
          showStep('stepProfile');
        }
      } catch(err) {
        successEl.textContent = '';
        if (err.code === 'auth/user-not-found') {
          errorEl.textContent = '⚠️ Account nahi mila. Pehle register karo!';
        } else if (err.code === 'auth/wrong-password') {
          errorEl.textContent = '⚠️ Galat password!';
        } else if (err.code === 'auth/invalid-email') {
          errorEl.textContent = '⚠️ Valid email daalo!';
        } else {
          errorEl.textContent = '⚠️ ' + err.message;
        }
      }
    }

    // ===== REGISTER =====
    async function doRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      const errorEl = document.getElementById('registerError');
      const successEl = document.getElementById('registerSuccess');

      if (!name || !email || !password || !confirm) {
        errorEl.textContent = '⚠️ Sabhi fields bharein!';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = '⚠️ Password kam se kam 6 characters ka hona chahiye!';
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = '⚠️ Passwords match nahi kar rahe!';
        return;
      }

      errorEl.textContent = '';
      successEl.textContent = 'Account bana rahe hain...';

      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        const user = result.user;

        // Save basic profile
        await db.ref(`users/${user.uid}`).set({
          name,
          email,
          contacts: [],
          createdAt: new Date().toISOString()
        });

        localStorage.setItem('safeher_user_id', user.uid);
        localStorage.setItem('safeher_user_name', name);

        successEl.textContent = '✅ Account ban gaya! Ab contacts add karo.';
        setTimeout(() => showStep('stepProfile'), 1000);

      } catch(err) {
        successEl.textContent = '';
        if (err.code === 'auth/email-already-in-use') {
          errorEl.textContent = '⚠️ Yeh email already registered hai. Login karo!';
        } else if (err.code === 'auth/invalid-email') {
          errorEl.textContent = '⚠️ Valid email daalo!';
        } else if (err.code === 'auth/weak-password') {
          errorEl.textContent = '⚠️ Password zyada strong banana hoga!';
        } else {
          errorEl.textContent = '⚠️ ' + err.message;
        }
      }
    }

    // ===== FORGOT PASSWORD =====
    async function forgotPassword() {
      const email = document.getElementById('loginEmail').value.trim();
      const errorEl = document.getElementById('loginError');
      const successEl = document.getElementById('loginSuccess');

      if (!email) {
        errorEl.textContent = '⚠️ Pehle email daalo, phir forgot password click karo.';
        return;
      }

      try {
        await auth.sendPasswordResetEmail(email);
        successEl.textContent = '✅ Password reset link bheja gaya ' + email + ' pe!';
        errorEl.textContent = '';
      } catch(err) {
        errorEl.textContent = '⚠️ Email nahi mila ya galat hai.';
      }
    }

    // ===== SAVE PROFILE =====
    async function saveProfile() {
      const c1Name = document.getElementById('contact1Name').value.trim();
      const c1Phone = document.getElementById('contact1Phone').value.trim();
      const c2Name = document.getElementById('contact2Name').value.trim();
      const c2Phone = document.getElementById('contact2Phone').value.trim();
      const errorEl = document.getElementById('profileError');

      const contacts = [];
      if (c1Name && c1Phone) contacts.push({ name: c1Name, phone: c1Phone });
      if (c2Name && c2Phone) contacts.push({ name: c2Name, phone: c2Phone });

      showLoading();

      try {
        const user = auth.currentUser;
        await db.ref(`users/${user.uid}/contacts`).set(contacts);
        localStorage.setItem('safeher_contacts', JSON.stringify(contacts));
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch(err) {
        showStep('stepProfile');
        errorEl.textContent = '⚠️ Save nahi hua: ' + err.message;
      }
    }

    function skipProfile() {
      showLoading();
      setTimeout(() => window.location.href = 'index.html', 800);
    }

    // ===== HELPERS =====
    function showStep(id) {
      ['stepAuth','stepProfile','stepLoading'].forEach(s => {
        document.getElementById(s).classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    }

    function showLoading() {
      showStep('stepLoading');
    }
  </script>
</body>
</html>
